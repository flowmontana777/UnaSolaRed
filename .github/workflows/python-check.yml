name: Python syntax check

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - ".github/workflows/python-check.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot.py
        run: python -m py_compile bot.py
